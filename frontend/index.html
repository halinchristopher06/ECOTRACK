<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Official brand mark. Browsers that honour media on icon links follow the OS colour scheme;
         others fall back to the first (light-plate) icon. -->
    <link rel="icon" type="image/png" href="/assets/brand/icon-light.png" />
    <link rel="icon" type="image/png" href="/assets/brand/icon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/assets/brand/icon-light.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoTrack</title>
    <script>
      // Applied before the first paint so the saved/system theme is in place immediately and the
      // page never flashes the wrong background while React boots.
      (function () {
        try {
          var stored = localStorage.getItem('ecotrack_theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
