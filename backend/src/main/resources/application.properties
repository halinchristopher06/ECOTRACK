spring.application.name=backend
server.port=${BACKEND_PORT:8080}
server.error.include-message=always

# Load local mail credentials from the project-root .env when running from backend/.
spring.config.import=optional:file:../.env[.properties]

spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Gmail ID used for OTP sending
spring.mail.username=YOUR_GMAIL_ID

# Gmail App Password (Google Authentication App Password)
spring.mail.password=YOUR_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Fail fast instead of hanging the HTTP request. JavaMail's defaults for these three are
# effectively "wait forever", so a slow/blocked SMTP handshake used to freeze OTP requests.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Multipart limits. These MUST be >= FileStorageService.MAX_FILE_SIZE_BYTES (10MB), otherwise
# Spring rejects an otherwise-valid upload with a 500 before the controller ever runs.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=16MB

otp.demo-fallback-enabled=false
database.reset-on-startup=false

# Email is dispatched on a separate thread pool so the OTP HTTP request is not blocked while
# Gmail's SMTP server is doing its TLS handshake. The request still waits (briefly) for a
# delivery confirmation so the response never claims success for an email that failed.
app.mail.async=true
app.mail.confirm-timeout-seconds=6

# Tesseract tessdata directory. Resolved in this order: this property, then the TESSDATA_PREFIX
# environment variable, then the common install locations for Windows/Linux/macOS. Set to the
# folder that ACTUALLY contains <language>.traineddata (forward slashes on Windows).
app.ocr.tessdata-path=C:/Program Files/Tesseract-OCR/tessdata
app.ocr.language=eng
# Tesseract page segmentation mode (6 = "assume a single uniform block of text", best for bills).
app.ocr.psm=6
# Cap how many pages of a PDF are text-stripped/OCR'd, so a large scanned bill can't stall the request.
app.ocr.max-pdf-pages=10

# Local MongoDB (install running as a Windows service, no auth by default)
spring.data.mongodb.uri=mongodb://localhost:27017/ecotrack

# MongoDB Atlas Configuration (alternative — replace USER_NAME and USER_PASSWORD with your MongoDB credentials)
# spring.data.mongodb.uri=mongodb+srv://USER_NAME:USER_PASSWORD@cluster0.brpf8sy.mongodb.net/ecotrack?retryWrites=true&w=majority&appName=Cluster0&connectTimeoutMS=10000&socketTimeoutMS=10000

spring.data.mongodb.auto-index-creation=false

# Local disk directory for storing uploaded bill documents (relative to backend working dir)
app.uploads.dir=uploads/bills

# Logging levels removed